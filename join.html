<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入我們 | 忠信壯我管樂團</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.png" type="image/png">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 15px;">
                <img src="assets/main_logo.jpg" alt="Logo" style="height: 45px; width: 45px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.5);"> 壯我管樂團
            </a>
            <div class="menu-toggle">☰</div>
            <ul class="nav-links">
                <li><a href="index.html">首頁</a></li>
                <li><a href="about.html">關於我們</a></li>
                <li><a href="conductor.html">指揮介紹</a></li>
                <li><a href="instruments.html">樂器介紹</a></li>
                <li><a href="events.html">近期演出</a></li>
                <li><a href="join.html" class="active">加入我們</a></li>
                <li><a href="contact.html">聯絡我們</a></li>
            </ul>
        </div>
    </nav>

    <header class="page-header" data-aos="fade-in">
        <h1>加入我們</h1>
        <p>Join Us</p>
    </header>

    <section class="section bg-white">
        <div class="container-sm" style="max-width: 700px; margin: 0 auto;">
            
            <div data-aos="fade-up" style="text-align: center; margin-bottom: 3rem;">
                <h2 class="serif" style="color: var(--dark-bg); margin-bottom: 1rem;">成為我們的一員</h2>
                <p style="color: #666; line-height: 1.8;">無論你是身經百戰的管樂老手，還是對音樂充滿熱忱的初學者，<br>壯我管樂團都歡迎你的加入！請填寫下方表單，我們會盡快與你聯繫。</p>
            </div>

            <div data-aos="fade-up" data-aos-delay="100">
                <form id="join-form" class="minimal-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group" style="text-align: left;">
                            <label for="name" style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent-gold); letter-spacing: 1px;">姓名</label>
                            <input type="text" id="name" name="name" class="form-control" required placeholder="請輸入您的姓名">
                        </div>
                        <div class="form-group" style="text-align: left;">
                            <label for="class_name" style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent-gold); letter-spacing: 1px;">班級</label>
                            <input type="text" id="class_name" name="class_name" class="form-control" required placeholder="例如：2029TCLIPa">
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group" style="text-align: left;">
                            <label for="seat_number" style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent-gold); letter-spacing: 1px;">座號</label>
                            <input type="number" id="seat_number" name="seat_number" class="form-control" required min="1" placeholder="例如：12">
                        </div>
                        <div class="form-group" style="text-align: left;">
                            <label for="contact_info" style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent-gold); letter-spacing: 1px;">Email / Line ID / IG</label>
                            <input type="text" id="contact_info" name="contact_info" class="form-control" required placeholder="請留下方便聯繫的方式">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group" style="text-align: left;">
                            <label for="instrument" style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent-gold); letter-spacing: 1px;">想學習 / 吹奏的樂器</label>
                            <input type="text" id="instrument" name="instrument" class="form-control" required placeholder="例如：長笛、小號，或還不確定">
                        </div>
                        <div class="form-group" style="text-align: left;">
                            <label for="experience" style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent-gold); letter-spacing: 1px;">學習經驗 (年)</label>
                            <input type="number" id="experience" name="experience" class="form-control" required min="0" max="9" step="1" placeholder="請輸入 0-9 整數 (新手填 0)" oninput="this.value = this.value.replace(/[^0-9]/g, '').substring(0,1)">
                        </div>
                    </div>

                    <!-- 條件顯示區域 -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="form-group" id="music_class_group" style="text-align: left; display: none;">
                            <label style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent-gold); letter-spacing: 1px;">是否為音樂班 / 藝才班？</label>
                            <div style="padding: 10px 0; color: #555;">
                                <label style="margin-right: 20px; cursor: pointer;"><input type="radio" name="is_music_class" value="是"> 是</label>
                                <label style="cursor: pointer;"><input type="radio" name="is_music_class" value="否" checked> 否</label>
                            </div>
                        </div>
                        <div class="form-group" id="school_group" style="text-align: left; display: none;">
                            <label for="school_name" style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent-gold); letter-spacing: 1px;">哪一間學校？</label>
                            <input type="text" id="school_name" name="school_name" class="form-control" placeholder="請輸入學校名稱">
                        </div>
                    </div>

                    <div class="form-group" style="text-align: left;">
                        <label for="message" style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent-gold); letter-spacing: 1px;">自我介紹 / 備註留言</label>
                        <textarea id="message" name="message" rows="4" class="form-control" placeholder="簡單介紹一下自己，或是想問的問題..."></textarea>
                    </div>
                    <div class="submit-wrap" style="text-align: center; margin-top: 2rem;">
                        <button type="submit" class="btn" id="submit-btn" style="padding: 15px 40px; font-size: 1.1rem; width: 100%; max-width: 300px;">送出報名表</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 忠信壯我管樂團 ZHUANGWO WIND BAND. ALL RIGHTS RESERVED.</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const expInput = document.getElementById('experience');
            const musicClassGroup = document.getElementById('music_class_group');
            const schoolGroup = document.getElementById('school_group');
            const musicClassRadios = document.getElementsByName('is_music_class');
            const schoolInput = document.getElementById('school_name');

            function updateForm() {
                // Because we restricted input to digits, we can safely parse int
                const years = parseInt(expInput.value) || 0;
                
                // 大於等於 3 年，顯示是否為音樂班
                if (years >= 3) {
                    musicClassGroup.style.display = 'block';
                    
                    let isMusicClass = false;
                    for (let radio of musicClassRadios) {
                        if (radio.checked && radio.value === '是') isMusicClass = true;
                    }
                    
                    // 若是音樂班，顯示學校輸入框
                    if (isMusicClass) {
                        schoolGroup.style.display = 'block';
                        schoolInput.required = true;
                    } else {
                        schoolGroup.style.display = 'none';
                        schoolInput.required = false;
                    }
                } else {
                    // 隱藏所有條件選項並重置
                    musicClassGroup.style.display = 'none';
                    schoolGroup.style.display = 'none';
                    schoolInput.required = false;
                    document.querySelector('input[name="is_music_class"][value="否"]').checked = true;
                    schoolInput.value = '';
                }
            }

            // 監聽數字輸入和選項變更
            expInput.addEventListener('input', updateForm);
            for (let radio of musicClassRadios) {
                radio.addEventListener('change', updateForm);
            }
        });
    </script>
</body>
</html>
