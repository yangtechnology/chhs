    <header class="page-header" data-aos="fade-in">
        <h1>聯絡我們</h1>
        <p>Contact & Booking</p>
    </header>
    <section class="section bg-white">
        <div class="container-sm" data-aos="fade-up" data-aos-delay="200">
            <form id="contact-form" class="minimal-form">
                <div class="form-group">
                    <input type="text" id="name" name="name" class="form-control" required placeholder="姓名 / 單位名稱 Name">
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" class="form-control" required placeholder="電子郵件 Email">
                </div>
                <div class="form-group">
                    <textarea id="message" name="message" rows="4" class="form-control" required placeholder="訊息內容 Message"></textarea>
                </div>
                <div class="submit-wrap">
                    <button type="submit" class="btn" id="submit-btn">SEND MESSAGE</button>
                    <div id="form-status" class="form-status"></div>
                </div>
            </form>
            <div style="margin-top: 4rem; text-align: center;" data-aos="fade-up">
                <a href="https://www.instagram.com/orchestra.chhs?stkn=bGhvOHlvYzMxaHdk" target="_blank" class="ig-btn">
